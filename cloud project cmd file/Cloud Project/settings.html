<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Appearance, notifications, language, security and storage settings.">

    <title>Settings · Cloud</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>&#9729;</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/app.css">

    <script>
        /* Paint the saved theme before first render so there is no flash. */
        (function () {
            try {
                var mode = localStorage.getItem("Cloud_theme") || "light";
                var dark = mode === "dark" ||
                    (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
                document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
                document.documentElement.setAttribute("data-theme-mode", mode);
            } catch (e) { /* storage blocked */ }
        }());
    </script>
</head>

<body data-page="settings">

    <a class="visually-hidden-focusable" href="#mainContent">Skip to main content</a>

    <div class="app-layout">

        <aside id="appSidebar" class="sidebar" aria-label="Main navigation"></aside>

        <div class="app-body">

            <header id="appHeader" class="app-header"></header>

            <main id="mainContent" class="app-content">
                <div class="content-head">
                    <div>
                        <h1 class="page-title">Settings</h1>
                        <p class="subtitle">Manage how Cloud looks and behaves for your account.</p>
                    </div>
                </div>

                <div class="row g-4">

                    <div class="col-12 col-lg-8">

                        <section class="panel" aria-labelledby="appearanceHeading">
                            <div class="panel-head"><h2 id="appearanceHeading">Appearance</h2></div>
                            <div class="panel-body">
                                <div class="field-label" style="margin-bottom:10px">Theme</div>
                                <div class="theme-choices" id="themeChoices"></div>
                            </div>
                        </section>

                        <section class="panel" style="margin-top:16px" aria-labelledby="generalHeading">
                            <div class="panel-head"><h2 id="generalHeading">General</h2></div>
                            <div class="panel-body" id="generalHost"></div>
                        </section>

                        <section class="panel" style="margin-top:16px" aria-labelledby="securityHeading">
                            <div class="panel-head"><h2 id="securityHeading">Security</h2></div>
                            <div class="panel-body">
                                <form id="passwordForm" novalidate style="max-width:420px">
                                    <div class="field">
                                        <label for="currentPassword">Current password</label>
                                        <input type="password" id="currentPassword" required
                                            autocomplete="current-password">
                                    </div>
                                    <div class="field">
                                        <label for="newPassword">New password</label>
                                        <input type="password" id="newPassword" minlength="6" required
                                            autocomplete="new-password">
                                    </div>
                                    <div class="field">
                                        <label for="confirmPassword">Confirm new password</label>
                                        <input type="password" id="confirmPassword" minlength="6" required
                                            autocomplete="new-password">
                                    </div>
                                    <button type="submit" class="btn-app-primary">Update password</button>
                                </form>
                            </div>
                        </section>

                    </div>

                    <div class="col-12 col-lg-4">

                        <section class="panel" aria-labelledby="accountHeading">
                            <div class="panel-head"><h2 id="accountHeading">Account</h2></div>
                            <div class="panel-body" id="accountHost"></div>
                        </section>

                        <section class="panel" style="margin-top:16px" aria-labelledby="storageSettingsHeading">
                            <div class="panel-head"><h2 id="storageSettingsHeading">Storage</h2></div>
                            <div class="panel-body" id="settingsStorageHost"></div>
                        </section>

                    </div>

                </div>
            </main>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/menu.js"></script>
    <script src="assets/js/select.js"></script>
    <script src="assets/js/upload.js"></script>
    <script src="assets/js/files.js"></script>
    <script src="assets/js/sharing.js"></script>
    <script src="assets/js/shell.js"></script>
    <script src="assets/js/pages/settings.js"></script>

</body>

</html>
