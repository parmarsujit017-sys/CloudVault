<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A file shared with you through Cloud.">
    <meta name="robots" content="noindex, nofollow">

    <title>Shared file · Cloud</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>&#9729;</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/app.css">

    <script>
        (function () {
            try {
                var mode = localStorage.getItem("Cloud_theme") || "light";
                var dark = mode === "dark" ||
                    (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
                document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
            } catch (e) { /* storage blocked */ }
        }());
    </script>
</head>

<body data-page="share">

    <main class="share-page">

        <div class="share-card">

            <div class="sp-brand">
                <span class="brand-mark"><i class="bi bi-cloud-fill" aria-hidden="true"></i></span>
                <span>Cloud</span>
            </div>

            <!-- Loading / error / content are swapped in by the page script -->
            <div id="shareState" aria-live="polite">
                <div class="skeleton sk-chip" style="width:52px;height:52px;margin:0 auto 16px"></div>
                <div class="skeleton sk-line" style="width:60%;margin:0 auto 8px"></div>
                <div class="skeleton sk-line" style="width:40%;margin:0 auto"></div>
            </div>

            <div id="shareContent" class="is-hidden"></div>

            <p style="margin-top:20px">
                <a href="login.html" style="font-size:12.5px">Go to Cloud</a>
            </p>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/pages/publicshare.js"></script>

</body>

</html>
