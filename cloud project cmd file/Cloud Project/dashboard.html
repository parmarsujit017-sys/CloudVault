<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Your Cloud overview: storage, recent files and account activity.">

    <title>Dashboard · Cloud</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>&#9729;</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/app.css">

    <script>
        /* Paint the saved theme before first render so there is no flash. */
        (function () {
            try {
                var mode = localStorage.getItem("Cloud_theme") || "light";
                var dark = mode === "dark" ||
                    (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
                document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
                document.documentElement.setAttribute("data-theme-mode", mode);
            } catch (e) { /* storage blocked */ }
        }());
    </script>
</head>

<body data-page="dashboard">

    <a class="visually-hidden-focusable" href="#mainContent">Skip to main content</a>

    <div class="app-layout">

        <aside id="appSidebar" class="sidebar" aria-label="Main navigation"></aside>

        <div class="app-body">

            <header id="appHeader" class="app-header"></header>

            <main id="mainContent" class="app-content">
                <div class="content-head">
                    <div>
                        <h1 class="page-title" id="greetingLine">Welcome back</h1>
                        <p class="subtitle">Manage your files, folders and shared content.</p>
                    </div>
                    <div class="head-actions">
                        <button type="button" class="btn-app-ghost" data-action="upload">
                            <i class="bi bi-upload" aria-hidden="true"></i><span>Upload</span>
                        </button>
                        <button type="button" class="btn-app-primary" data-action="new-folder">
                            <i class="bi bi-folder-plus" aria-hidden="true"></i><span>New folder</span>
                        </button>
                    </div>
                </div>

                <section aria-label="Account summary">
                    <div class="stat-grid" id="statGrid"></div>
                </section>

                <section aria-labelledby="recentFilesHeading">
                    <div class="section-heading">
                        <h2 id="recentFilesHeading">Recent files</h2>
                        <a class="btn-app-ghost btn-sm-app" href="recent.html">View all</a>
                    </div>
                    <div id="recentFiles"></div>
                </section>

                <section aria-labelledby="recentActivityHeading">
                    <div class="section-heading">
                        <h2 id="recentActivityHeading">Recent activity</h2>
                        <a class="btn-app-ghost btn-sm-app" href="activity.html">View all</a>
                    </div>
                    <div class="panel" id="recentActivity"></div>
                </section>
            </main>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/menu.js"></script>
    <script src="assets/js/select.js"></script>
    <script src="assets/js/upload.js"></script>
    <script src="assets/js/files.js"></script>
    <script src="assets/js/sharing.js"></script>
    <script src="assets/js/shell.js"></script>
    <script src="assets/js/pages/dashboard.js"></script>

</body>

</html>
