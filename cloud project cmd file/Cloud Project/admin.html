<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="CloudVault administration: users, storage and subscription plans.">
    <meta name="robots" content="noindex, nofollow">

    <title>Admin · CloudVault</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>&#9729;</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/app.css">

    <script>
        /* Paint the saved theme before first render so there is no flash. */
        (function () {
            try {
                var mode = localStorage.getItem("cloudvault_theme") || "light";
                var dark = mode === "dark" ||
                    (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
                document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
                document.documentElement.setAttribute("data-theme-mode", mode);
            } catch (e) { /* storage blocked */ }
        }());
    </script>
</head>

<body data-page="admin">

    <a class="visually-hidden-focusable" href="#adminMain">Skip to main content</a>

    <!-- ================= Sign in ================= -->
    <main class="admin-gate" id="adminGate" hidden>
        <div class="admin-gate-card">

            <div class="sp-brand">
                <span class="brand-mark"><i class="bi bi-cloud-fill" aria-hidden="true"></i></span>
                <span>CloudVault</span>
            </div>

            <h1 class="admin-gate-title">Administrator sign in</h1>
            <p class="admin-gate-sub" id="gateSub">
                This area manages every account and plan. Ordinary accounts cannot open it.
            </p>

            <form id="adminLoginForm" novalidate>
                <div class="field">
                    <label for="adminUsername">Username</label>
                    <input type="text" id="adminUsername" autocomplete="username"
                        placeholder="Administrator username" required autofocus>
                </div>

                <div class="field">
                    <label for="adminPassword">Password</label>
                    <div class="input-affix">
                        <input type="password" id="adminPassword" autocomplete="current-password"
                            placeholder="Password" required>
                        <button type="button" class="affix-btn" id="adminPwToggle"
                            aria-label="Show password">
                            <i class="bi bi-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                <div class="error-text is-hidden" id="adminLoginError" role="alert"></div>

                <button type="submit" class="btn-app-primary btn-block" id="adminLoginSubmit">
                    Sign in
                </button>
            </form>

            <p class="admin-gate-foot">
                <a href="login.html">Back to CloudVault</a>
            </p>

        </div>
    </main>

    <!-- ================= Panel ================= -->
    <div class="admin-shell" id="adminShell" hidden>

        <aside class="admin-side" aria-label="Admin sections">
            <div class="admin-brand">
                <span class="brand-mark"><i class="bi bi-cloud-fill" aria-hidden="true"></i></span>
                <div>
                    <strong>CloudVault</strong>
                    <span class="admin-brand-tag">Admin</span>
                </div>
            </div>

            <nav class="admin-nav" id="adminNav" aria-label="Admin navigation">
                <button type="button" class="admin-nav-item is-active" data-view="overview">
                    <i class="bi bi-speedometer2" aria-hidden="true"></i><span>Overview</span>
                </button>
                <button type="button" class="admin-nav-item" data-view="users">
                    <i class="bi bi-people" aria-hidden="true"></i><span>Users</span>
                    <span class="admin-nav-count" id="navUserCount"></span>
                </button>
                <button type="button" class="admin-nav-item" data-view="plans">
                    <i class="bi bi-box-seam" aria-hidden="true"></i><span>Plans</span>
                    <span class="admin-nav-count" id="navPlanCount"></span>
                </button>
            </nav>

            <div class="admin-side-foot">
                <div class="admin-who">
                    <i class="bi bi-shield-lock-fill" aria-hidden="true"></i>
                    <div>
                        <strong id="adminWhoName">—</strong>
                        <span id="adminWhoUser"></span>
                    </div>
                </div>
                <div class="admin-side-actions">
                    <a class="btn-app-ghost btn-sm-app" href="dashboard.html">
                        <i class="bi bi-box-arrow-up-right" aria-hidden="true"></i><span>My drive</span>
                    </a>
                    <button type="button" class="btn-app-ghost btn-sm-app" id="adminThemeToggle"
                        aria-label="Toggle dark mode">
                        <i class="bi bi-moon-stars" aria-hidden="true"></i>
                    </button>
                    <button type="button" class="btn-app-ghost btn-sm-app is-danger" id="adminLogout">
                        <i class="bi bi-box-arrow-right" aria-hidden="true"></i><span>Sign out</span>
                    </button>
                </div>
            </div>
        </aside>

        <main class="admin-main" id="adminMain">
            <header class="admin-head">
                <div>
                    <h1 class="page-title" id="adminViewTitle">Overview</h1>
                    <p class="admin-head-sub" id="adminViewSub"></p>
                </div>
                <div class="head-actions" id="adminHeadActions"></div>
            </header>

            <div id="adminBody" aria-live="polite"></div>
        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/menu.js"></script>
    <script src="assets/js/pages/admin.js"></script>

</body>

</html>
