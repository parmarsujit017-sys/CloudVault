<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A timeline of everything that has happened on your account.">

    <title>Activity · Cloud</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>&#9729;</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/app.css">

    <script>
        /* Paint the saved theme before first render so there is no flash. */
        (function () {
            try {
                var mode = localStorage.getItem("Cloud_theme") || "light";
                var dark = mode === "dark" ||
                    (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
                document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
                document.documentElement.setAttribute("data-theme-mode", mode);
            } catch (e) { /* storage blocked */ }
        }());
    </script>
</head>

<body data-page="activity">

    <a class="visually-hidden-focusable" href="#mainContent">Skip to main content</a>

    <div class="app-layout">

        <aside id="appSidebar" class="sidebar" aria-label="Main navigation"></aside>

        <div class="app-body">

            <header id="appHeader" class="app-header"></header>

            <main id="mainContent" class="app-content">
                <div class="content-head">
                    <div>
                        <h1 class="page-title">Activity</h1>
                        <p class="subtitle">A record of everything that happens on your account.</p>
                    </div>
                </div>

                <div class="toolbar">
                    <div class="chip-row" id="activityFilters" role="group"
                        aria-label="Filter activity by type"></div>
                </div>

                <section aria-label="Activity timeline">
                    <div class="panel" id="activityHost"></div>
                </section>
            </main>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/menu.js"></script>
    <script src="assets/js/select.js"></script>
    <script src="assets/js/upload.js"></script>
    <script src="assets/js/files.js"></script>
    <script src="assets/js/sharing.js"></script>
    <script src="assets/js/shell.js"></script>
    <script src="assets/js/pages/activity.js"></script>

</body>

</html>
